name: Apply Wind Wave V63

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-wind-wave-v63.yml"

permissions:
  contents: write

jobs:
  apply-v63:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Apply approved homepage changes
        run: python wind-wave/_patch_v63/apply.py

      - name: Clean helper files and commit
        shell: bash
        run: |
          rm -rf wind-wave/_patch_v63
          rm -f .github/workflows/apply-wind-wave-v63.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Wind & Wave homepage to V63"
          git push
