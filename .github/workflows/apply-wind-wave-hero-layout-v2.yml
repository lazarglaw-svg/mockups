name: Apply Wind Wave Hero Layout V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-wind-wave-hero-layout-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply hero layout patch
        run: python3 scripts/patch_wind_wave_hero_layout.py

      - name: Commit homepage
        run: |
          if git diff --quiet -- wind-wave/index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wind-wave/index.html
          git commit -m 'Fix Wind & Wave mobile hero structure'
          git push origin main
