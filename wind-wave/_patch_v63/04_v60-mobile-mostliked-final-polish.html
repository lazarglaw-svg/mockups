<style id="v60-mobile-mostliked-final-polish">
/* ===== V60 — MOBILE MOST LIKED FINAL POLISH ===== */

@media (max-width: 760px) {

  /* Give the USP block its own space so "Most liked" starts clearly below it. */
  .liked {
    padding-top: 188px !important;
    padding-bottom: 62px !important;
  }

  /* Header spacing: compact, but not crowded by the USP cards above. */
  .liked .section-header {
    width: calc(100% - 28px) !important;
    margin: 0 auto 20px !important;
    gap: 14px !important;
  }

  .liked .heading-line h2.hero-title {
    font-size: clamp(44px, 14.5vw, 56px) !important;
    line-height: .9 !important;
  }

  .liked .section-copy {
    max-width: 34ch !important;
    margin-top: 9px !important;
    font-size: 13px !important;
    line-height: 1.42 !important;
  }

  .liked .carousel-head-actions {
    margin-top: 2px !important;
    width: 100% !important;
  }

  /* Exactly one underline — remove inherited link decoration/border. */
  .liked .ghost-link {
    position: relative !important;
    display: inline-flex !important;
    text-decoration: none !important;
    border-bottom: 0 !important;
    box-shadow: none !important;
    padding-bottom: 5px !important;
    font-size: 21px !important;
  }

  .liked .ghost-link::after {
    content: "" !important;
    position: absolute !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    height: 1px !important;
    background: currentColor !important;
    opacity: .82 !important;
  }

  .liked .carousel-arrow {
    width: 40px !important;
    height: 40px !important;
  }

  /* Around 1.2 cards visible on iPhone:
     first card is dominant, second card is a deliberate preview. */
  .liked .card-track {
    grid-auto-columns: 82vw !important;
    gap: 12px !important;
    padding: 3px 10vw 8px 14px !important;
    scroll-padding-left: 14px !important;
    scroll-snap-type: x mandatory !important;
  }

  .liked .dive-card {
    border-radius: 21px !important;
    min-height: 0 !important;
  }

  /* Image becomes the clear visual majority of the card. */
  .liked .dive-card .card-image {
    aspect-ratio: 1.18 / 1 !important;
    min-height: 0 !important;
  }

  /* Compact information block below image. */
  .liked .dive-card .card-body {
    min-height: 0 !important;
    gap: 8px !important;
    padding: 12px 14px 14px !important;
  }

  .scuba-meta-row-v59 {
    gap: 8px !important;
  }

  .scuba-duration-v59 {
    font-size: 11px !important;
  }

  .scuba-type-v59 {
    padding: 6px 8px !important;
    font-size: 8.5px !important;
    letter-spacing: .055em !important;
  }

  .liked .dive-card .card-title {
    font-size: 31px !important;
    line-height: .95 !important;
  }

  .liked .dive-card .card-text {
    font-size: 12px !important;
    line-height: 1.42 !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 3 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
  }

  .scuba-tags-v59 {
    gap: 5px !important;
  }

  .scuba-tags-v59 span {
    padding: 6px 8px !important;
    font-size: 7.5px !important;
  }

  .scuba-card-footer-v59 {
    margin-top: 2px !important;
    padding-top: 9px !important;
  }

  .scuba-note-v59 {
    font-size: 9.5px !important;
  }

  .liked .dive-card .scuba-arrow-v59 {
    width: 38px !important;
    height: 38px !important;
    flex-basis: 38px !important;
  }
}

@media (max-width: 420px) {
  .liked {
    padding-top: 184px !important;
  }

  .liked .section-header {
    width: calc(100% - 24px) !important;
    margin-bottom: 18px !important;
  }

  .liked .heading-line h2.hero-title {
    font-size: 47px !important;
  }

  .liked .section-copy {
    max-width: 32ch !important;
    font-size: 12.2px !important;
  }

  .liked .ghost-link {
    font-size: 20px !important;
  }

  .liked .card-track {
    grid-auto-columns: 82.5vw !important;
    gap: 11px !important;
    padding-left: 12px !important;
    scroll-padding-left: 12px !important;
    padding-right: 10vw !important;
  }

  .liked .dive-card .card-image {
    aspect-ratio: 1.15 / 1 !important;
  }

  .liked .dive-card .card-body {
    padding: 11px 13px 13px !important;
  }

  .liked .dive-card .card-title {
    font-size: 29px !important;
  }

  .liked .dive-card .card-text {
    font-size: 11.8px !important;
  }
}
</style>
