<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031927">
<title>Marlin Fishing | Cancún Fishing Charters</title>
<style>html,body{margin:0;min-height:100%;background:#031927;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.loading{opacity:.75;font-size:14px;letter-spacing:.08em;text-transform:uppercase}</style>
</head>
<body>
<div class="loading">Loading Marlin Fishing…</div>
<script>
(async()=>{
  try{
    let html=await fetch('./site.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
    const end=html.lastIndexOf('</html>');
    if(end!==-1) html=html.slice(0,end+7);

    // English-only live version: remove hreflang alternatives and the EN/ES switcher.
    html=html.replace(/<link href="index\.html" hreflang="en" rel="alternate"\/><link href="es\.html" hreflang="es" rel="alternate"\/>/,'');
    html=html.replace(/<div aria-label="Language" class="lang-switch">[\s\S]*?<\/div>/,'');

    // Mobile fleet: show roughly 1.2 cards so the swipe interaction is obvious.
    const liveOverrides=`<style id="live-overrides">
      .lang-switch{display:none!important}
      @media(max-width:640px){
        .boats .boat-grid{
          display:flex!important;
          width:100vw!important;
          max-width:none!important;
          gap:12px!important;
          margin-left:calc(50% - 50vw)!important;
          margin-right:calc(50% - 50vw)!important;
          padding:0 20px 10px!important;
          overflow-x:auto!important;
          scroll-padding-left:20px!important;
          align-items:stretch!important;
          -webkit-overflow-scrolling:touch!important;
          scrollbar-width:none!important;
        }
        .boats .boat-grid::-webkit-scrollbar{display:none!important}
        .boats .boat-card{
          flex:0 0 76.5vw!important;
          width:76.5vw!important;
          max-width:360px!important;
          height:auto!important;
          scroll-snap-align:start!important;
        }
      }
    </style>`;
    html=html.replace('</head>',liveOverrides+'</head>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:24px;text-align:center"><strong>Marlin Fishing</strong><br><br>Page could not be loaded. Please refresh.</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
