<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031927">
<title>Marlin Fishing | Cancún Fishing Charters</title>
<style>html,body{margin:0;min-height:100%;background:#031927;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.loading{opacity:.75;font-size:14px;letter-spacing:.08em;text-transform:uppercase}</style>
</head>
<body>
<div class="loading">Loading Marlin Fishing…</div>
<script>
(async()=>{
  try{
    let html=await fetch('./site.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
    const end=html.lastIndexOf('</html>');
    if(end!==-1) html=html.slice(0,end+7);

    // English-only live version: remove hreflang alternatives and the EN/ES switcher.
    html=html.replace(/<link href="index\.html" hreflang="en" rel="alternate"\/><link href="es\.html" hreflang="es" rel="alternate"\/>/,'');
    html=html.replace(/<div aria-label="Language" class="lang-switch">[\s\S]*?<\/div>/,'');

    // Mobile fleet: show roughly 1.2 cards so the swipe interaction is obvious.
    // Floating WhatsApp button: fixed bottom-right on desktop and mobile.
    const liveOverrides=`<style id="live-overrides">
      .lang-switch{display:none!important}
      .floating-whatsapp{
        position:fixed;
        right:22px;
        bottom:22px;
        z-index:9999;
        width:58px;
        height:58px;
        display:grid;
        place-items:center;
        border-radius:50%;
        background:#25D366;
        color:#fff;
        box-shadow:0 12px 30px rgba(0,0,0,.28);
        border:1px solid rgba(255,255,255,.28);
        transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
        -webkit-tap-highlight-color:transparent;
      }
      .floating-whatsapp:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 36px rgba(0,0,0,.34);background:#20bd5a}
      .floating-whatsapp:focus-visible{outline:3px solid #fff;outline-offset:3px}
      .floating-whatsapp svg{width:30px;height:30px;display:block;fill:currentColor}
      @media(max-width:640px){
        .boats .boat-grid{
          display:flex!important;
          width:100vw!important;
          max-width:none!important;
          gap:12px!important;
          margin-left:calc(50% - 50vw)!important;
          margin-right:calc(50% - 50vw)!important;
          padding:0 20px 10px!important;
          overflow-x:auto!important;
          scroll-padding-left:20px!important;
          align-items:stretch!important;
          -webkit-overflow-scrolling:touch!important;
          scrollbar-width:none!important;
        }
        .boats .boat-grid::-webkit-scrollbar{display:none!important}
        .boats .boat-card{
          flex:0 0 76.5vw!important;
          width:76.5vw!important;
          max-width:360px!important;
          height:auto!important;
          scroll-snap-align:start!important;
        }
        .floating-whatsapp{
          width:56px;
          height:56px;
          right:16px;
          bottom:calc(16px + env(safe-area-inset-bottom));
        }
        .floating-whatsapp svg{width:29px;height:29px}
      }
    </style>`;
    html=html.replace('</head>',liveOverrides+'</head>');

    const whatsappButton=`<a class="floating-whatsapp" href="https://wa.me/" target="_blank" rel="noopener noreferrer" aria-label="Contact us on WhatsApp" title="WhatsApp">
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M19.11 17.44c-.3-.15-1.78-.88-2.05-.98-.28-.1-.48-.15-.68.15-.2.3-.78.98-.95 1.18-.18.2-.35.23-.65.08-.3-.15-1.27-.47-2.42-1.49-.9-.8-1.5-1.78-1.68-2.08-.18-.3-.02-.46.13-.61.14-.14.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.03-.53-.08-.15-.68-1.63-.93-2.23-.24-.59-.49-.51-.68-.52h-.58c-.2 0-.53.08-.8.38-.28.3-1.05 1.03-1.05 2.5s1.08 2.9 1.23 3.1c.15.2 2.12 3.24 5.14 4.54.72.31 1.28.5 1.72.64.72.23 1.38.2 1.9.12.58-.09 1.78-.73 2.03-1.43.25-.7.25-1.3.18-1.43-.08-.13-.28-.2-.58-.35zM16.04 3.2c-7.08 0-12.84 5.76-12.84 12.84 0 2.26.59 4.47 1.71 6.41L3.1 29l6.71-1.76a12.8 12.8 0 0 0 6.22 1.59h.01c7.08 0 12.84-5.76 12.84-12.84S23.12 3.2 16.04 3.2zm0 23.46h-.01c-1.91 0-3.79-.52-5.42-1.5l-.39-.23-3.98 1.04 1.06-3.88-.25-.4a10.62 10.62 0 0 1-1.63-5.65c0-5.86 4.77-10.63 10.64-10.63 5.86 0 10.63 4.77 10.63 10.63 0 5.86-4.78 10.62-10.65 10.62z"/></svg>
    </a>`;
    html=html.replace('</body>',whatsappButton+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:24px;text-align:center"><strong>Marlin Fishing</strong><br><br>Page could not be loaded. Please refresh.</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
